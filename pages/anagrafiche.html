<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tracker Ristrutturazione — Anagrafiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/anagrafiche.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-eyebrow">Anagrafica</div>
    <div class="header-title">Anagrafiche</div>
    <div class="header-subtitle">Ditte, abitazioni/uffici e categorie di spesa</div>
  </div>
  <nav class="topnav">
    <a href="../index.html">Home</a>
    <a href="spese.html">Spese &amp; Preventivi</a>
    <a href="anagrafiche.html">Anagrafiche</a>
  </nav>
</header>

<main class="main">
  <div class="tabs">
    <button class="tab-btn active" id="tabBtnDitte" onclick="switchTab('ditte')">Ditte</button>
    <button class="tab-btn" id="tabBtnAbit" onclick="switchTab('abitazioni')">Abitazioni</button>
    <button class="tab-btn" id="tabBtnCat" onclick="switchTab('categorie')">Categorie</button>
  </div>

  <!-- ── TAB DITTE ── -->
  <div id="panelDitte">
    <div class="toolbar">
      <div class="toolbar-left"><div style="font-size:13px;color:var(--text-muted)" id="ditteCount"></div></div>
      <div class="toolbar-right"><button class="btn primary" onclick="openDittaModal()">+ Nuova ditta</button></div>
    </div>
    <div class="reg-grid" id="ditteGrid"></div>
    <div class="empty-state" id="ditteEmpty" style="display:none">
      <div class="empty-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="18" rx="1"/><path d="M9 3v18M7 7h1M7 11h1M7 15h1M11 7h1M11 11h1M11 15h1"/><path d="M15 10h4a1 1 0 0 1 1 1v10h-5"/></svg></div>
      <p>Nessuna ditta registrata.</p>
      <button class="btn primary" onclick="openDittaModal()">+ Aggiungi la prima ditta</button>
    </div>
  </div>

  <!-- ── TAB ABITAZIONI ── -->
  <div id="panelAbitazioni" style="display:none">
    <div class="toolbar">
      <div class="toolbar-left"><div style="font-size:13px;color:var(--text-muted)" id="abitCount"></div></div>
      <div class="toolbar-right"><button class="btn primary" onclick="openAbitModal()">+ Nuova abitazione</button></div>
    </div>
    <div class="reg-grid" id="abitGrid"></div>
    <div class="empty-state" id="abitEmpty" style="display:none">
      <div class="empty-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1H10v-5a2 2 0 0 1 2-2v0a2 2 0 0 1 2 2v5h3.5a1 1 0 0 0 1-1V9.5"/></svg></div>
      <p>Nessuna abitazione registrata.</p>
      <button class="btn primary" onclick="openAbitModal()">+ Aggiungi la prima abitazione</button>
    </div>
  </div>

  <!-- ── TAB CATEGORIE ── -->
  <div id="panelCategorie" style="display:none">
    <div class="toolbar">
      <div class="toolbar-left"><div style="font-size:13px;color:var(--text-muted)" id="catCount"></div></div>
      <div class="toolbar-right"><button class="btn primary" onclick="openCatModal()">+ Nuova categoria</button></div>
    </div>
    <div class="reg-grid" id="catGrid"></div>
    <div class="empty-state" id="catEmpty" style="display:none">
      <div class="empty-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3h6a2 2 0 0 1 2 2v6l-9.5 9.5a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L11 3Z"/><circle cx="15" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg></div>
      <p>Nessuna categoria registrata.</p>
      <button class="btn primary" onclick="openCatModal()">+ Aggiungi la prima categoria</button>
    </div>
  </div>
</main>

<!-- Modal Ditta -->
<div class="modal-overlay" id="dittaModalOverlay" onclick="if(event.target===this)closeDittaModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="dittaModalTitle">Nuova ditta</div>
      <button class="modal-close" onclick="closeDittaModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="field"><label>Ragione sociale</label><input type="text" id="d-nome" placeholder="es. Rossi Costruzioni Srl"></div>
    <div class="field-row">
      <div class="field"><label>P.IVA / C.F.</label><input type="text" id="d-piva" placeholder="es. 01234567890"></div>
      <div class="field"><label>Referente</label><input type="text" id="d-referente" placeholder="Nome referente"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Telefono</label><input type="tel" id="d-telefono" placeholder="es. 333 1234567"></div>
      <div class="field"><label>Email</label><input type="email" id="d-email" placeholder="es. info@ditta.it"></div>
    </div>
    <div class="field"><label>Note</label><textarea id="d-note" placeholder="Specializzazione, riferimenti, condizioni…"></textarea></div>
    <div class="modal-footer">
      <button class="btn secondary-cancel" onclick="closeDittaModal()">Annulla</button>
      <button class="btn primary" onclick="saveDittaForm()">Salva ditta</button>
    </div>
  </div>
</div>

<!-- Modal Abitazione -->
<div class="modal-overlay" id="abitModalOverlay" onclick="if(event.target===this)closeAbitModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="abitModalTitle">Nuova abitazione</div>
      <button class="modal-close" onclick="closeAbitModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="field"><label>Nome / etichetta</label><input type="text" id="a-nome" placeholder="es. Casa Piano Terra, Ufficio Milano…"></div>
    <div class="field"><label>Indirizzo</label><input type="text" id="a-indirizzo" placeholder="Via, civico, città"></div>
    <div class="field-row3">
      <div class="field"><label>Foglio</label><input type="text" id="a-foglio" placeholder="es. 12"></div>
      <div class="field"><label>Particella</label><input type="text" id="a-particella" placeholder="es. 345"></div>
      <div class="field"><label>Subalterno</label><input type="text" id="a-subalterno" placeholder="es. 7"></div>
    </div>
    <div class="field"><label>Note</label><textarea id="a-note" placeholder="Dettagli aggiuntivi…"></textarea></div>
    <div class="modal-footer">
      <button class="btn secondary-cancel" onclick="closeAbitModal()">Annulla</button>
      <button class="btn primary" onclick="saveAbitForm()">Salva abitazione</button>
    </div>
  </div>
</div>

<!-- Modal Categoria -->
<div class="modal-overlay" id="catModalOverlay" onclick="if(event.target===this)closeCatModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="catModalTitle">Nuova categoria</div>
      <button class="modal-close" onclick="closeCatModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="field"><label>Nome categoria</label><input type="text" id="c-nome" placeholder="es. Impianto elettrico"></div>
    <div class="modal-footer">
      <button class="btn secondary-cancel" onclick="closeCatModal()">Annulla</button>
      <button class="btn primary" onclick="saveCatForm()">Salva categoria</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/shared.js"></script>
<script src="../js/anagrafiche.js"></script>
</body>
</html>
